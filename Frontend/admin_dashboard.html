<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | NeuroBin</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .admin-sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--surface-border);
            padding: 2rem 1rem;
            height: 100vh;
            position: sticky;
            top: 0;
        }
        .main-content {
            flex: 1;
            padding: 2.5rem;
        }
        .user-list-card {
            margin-top: 2rem;
        }
        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .user-info {
            display: flex;
            flex-direction: column;
        }
        .user-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body style="display: flex;">

<aside class="admin-sidebar">
    <div class="logo mb-8">NeuroBin <span style="font-size: 0.8rem; opacity: 0.7;">Admin</span></div>
    <nav class="nav-menu">
        <a href="#" class="menu-item active" onclick="showSection('doctors')">Manage Doctors</a>
        <a href="#" class="menu-item" onclick="showSection('caretakers')">Manage Caretakers</a>
        <a href="#" class="menu-item" onclick="showSection('patients')">Manage Patients</a>
        <a href="#" class="menu-item logout-btn" onclick="logout()">Logout</a>
    </nav>
</aside>

<main class="main-content">
    <div class="header">
        <h1 id="sectionTitle">Manage Doctors</h1>
        <button class="btn btn-primary" onclick="openAddModal()">Add New User</button>
    </div>

    <div class="glass-card user-list-card" id="userList">
        <!-- Users will be populated here -->
        <p class="text-center p-8">Loading users...</p>
    </div>
</main>

<!-- Add User Modal -->
<div class="modal-overlay" id="addModal">
    <div class="glass-panel modal-content" style="padding: 2rem; width: 500px;">
        <div class="modal-header">
            <h2 id="modalTitle">Add Doctor</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <form id="addUserForm">
            <input type="hidden" id="targetRole" value="doctor">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" required>
            </div>
            <div id="dynamicFields">
                <!-- Role specific fields -->
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-4">Create User</button>
        </form>
    </div>
</div>

<script src="theme.js"></script>
<script src="api.js"></script>
<script>
    let currentRole = 'doctor';
    let users = [];

    async function loadUsers() {
        try {
            const allUsers = await ApiClient.request('/admin/users');
            users = allUsers.filter(u => u.role === currentRole);
            renderUsers();
        } catch (e) {
            ApiClient.notify(e.message, 'error');
        }
    }

    function renderUsers() {
        const list = document.getElementById('userList');
        if (users.length === 0) {
            list.innerHTML = `<div class="p-8 text-center text-muted">No ${currentRole}s found.</div>`;
            return;
        }
        list.innerHTML = users.map(u => `
            <div class="user-row">
                <div class="user-info">
                    <span style="font-weight:600;">${u.username}</span>
                    <span class="user-meta">${u.email}</span>
                </div>
                <button class="btn btn-danger" style="padding:0.4rem 0.8rem; font-size:0.8rem;" onclick="deleteUser(${u.id})">Delete</button>
            </div>
        `).join('');
    }

    async function deleteUser(id) {
        if (!confirm('Are you sure you want to delete this user? This cannot be undone.')) return;
        try {
            await ApiClient.request(`/admin/user/${id}`, { method: 'DELETE' });
            ApiClient.notify('User deleted successfully', 'success');
            loadUsers();
        } catch (e) {
            ApiClient.notify(e.message, 'error');
        }
    }

    function showSection(role) {
        currentRole = role;
        document.getElementById('sectionTitle').textContent = `Manage ${role.charAt(0).toUpperCase() + role.slice(1)}s`;
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        event.target.classList.add('active');
        loadUsers();
    }

    function openAddModal() {
        document.getElementById('addModal').classList.add('active');
        document.getElementById('modalTitle').textContent = `Add ${currentRole.charAt(0).toUpperCase() + currentRole.slice(1)}`;
        setupDynamicFields();
    }

    function closeModal() {
        document.getElementById('addModal').classList.remove('active');
    }

    function setupDynamicFields() {
        const container = document.getElementById('dynamicFields');
        if (currentRole === 'doctor') {
            container.innerHTML = `
                <div class="form-group"><label class="form-label">License Number</label><input type="text" id="license_number" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Degree</label><input type="text" id="degree" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Experience (Years)</label><input type="number" id="experience" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Phone</label><input type="text" id="phone" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Age</label><input type="number" id="age" class="form-input" required></div>
            `;
        } else if (currentRole === 'caretaker') {
            container.innerHTML = `
                <div class="form-group"><label class="form-label">License Number</label><input type="text" id="license_number" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Grade</label><input type="text" id="grade" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Salary</label><input type="number" id="salary" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Experience (Years)</label><input type="number" id="experience" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Phone</label><input type="text" id="phone" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Age</label><input type="number" id="age" class="form-input" required></div>
            `;
        } else {
            container.innerHTML = `
                <div class="form-group"><label class="form-label">Age</label><input type="number" id="age" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Address</label><input type="text" id="address" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Phone</label><input type="text" id="phone" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Medical History</label><textarea id="medical_history" class="form-input"></textarea></div>
            `;
        }
    }

    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {};
        const inputs = e.target.querySelectorAll('input, textarea');
        inputs.forEach(i => { if (i.id) data[i.id] = i.value; });

        try {
            const endpoint = `/admin/register/${currentRole}`;
            await ApiClient.request(endpoint, {
                method: 'POST',
                body: JSON.stringify(data)
            });
            ApiClient.notify('User created successfully!', 'success');
            closeModal();
            loadUsers();
        } catch (e) {
            ApiClient.notify(e.message, 'error');
        }
    });

    function logout() {
        ApiClient.setToken(null);
        window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadUsers();
    });
</script>
</body>
</html>
