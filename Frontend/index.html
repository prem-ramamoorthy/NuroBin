<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroBin | Connect & Protect</title>
    <meta name="description" content="AI-Assisted Real-Time Multimodal Cognitive Support System for Dementia Patients Aging in Place">
    <link rel="stylesheet" href="theme.css">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-card {
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .brand-header p {
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: rgba(255,255,255,0.4);
            padding: 0.25rem;
            border-radius: var(--radius-md);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .tab.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .feature-bullets {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .feature-item svg {
            color: var(--primary);
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Password Toggle */
        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        /* Demo Credentials */
        .demo-creds {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(79, 70, 229, 0.05);
            border: 1px dashed rgba(79, 70, 229, 0.2);
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .demo-creds:hover {
            background: rgba(79, 70, 229, 0.08);
            border-color: var(--primary);
        }

        .demo-creds-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .demo-creds-body {
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .demo-creds code {
            background: rgba(0,0,0,0.05);
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<!-- Theme Toggle Button -->
<button id="themeToggleBtn" style="position: absolute; top: 1rem; right: 1rem; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); backdrop-filter: blur(8px); z-index: 1000; box-shadow: var(--shadow-sm);">
    <svg id="themeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px;">
        <!-- Icon set in JS -->
    </svg>
</button>

<div class="login-wrapper">
    <div class="glass-panel login-card fade-in">
        <div class="brand-header">
            <h1 class="logo">NeuroBin</h1>
            <p>Cognitive Support System</p>
        </div>

        <div class="tabs">
            <div class="tab active" data-role="family">Family / Caregiver</div>
            <div class="tab" data-role="doctor">Clinical</div>
            <!-- <div class="tab" data-role="patient">Patient Demo</div> temporarily disabled -->
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Username / Email</label>
                <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group mb-6">
                <label class="form-label" for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" id="passwordToggle" title="Toggle Password Visibility">
                        <svg id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                Secure Login
            </button>

            <!-- Demo Credentials Box -->
            <div class="demo-creds" id="demoCredsBox">
                <div class="demo-creds-title">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 16px; height: 16px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Demo Access
                </div>
                <div class="demo-creds-body">
                    <div>Email: <code id="demoEmail">caregiver@neurobin.com</code></div>
                    <div>Pass: <code id="demoPass">neurobin123</code></div>
                </div>
                <div class="mt-2 text-muted" style="font-size: 0.75rem; font-style: italic;">
                    Click to auto-fill
                </div>
            </div>
        </form>

        <!-- Admin Portal temporarily disabled -->
        <!-- <div class="mt-8 pt-4 border-t text-center" style="border-color: rgba(0,0,0,0.05);">
            <a href="admin_login.html" class="text-muted" style="text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem; transition: var(--transition);">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 16px; height: 16px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                Administration Portal
            </a>
        </div> -->

        <div class="feature-bullets">
            <div class="feature-item">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                AES-256 Encrypted & HIPAA/GDPR Compliant
            </div>
            <div class="feature-item">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Real-time Memory Augmentation
            </div>
            <div class="feature-item">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
                Proactive Medication Management
            </div>
        </div>
    </div>
</div>

<script src="theme.js"></script>
<script src="api.js"></script>
<script src="login.js"></script>
</body>
</html>
